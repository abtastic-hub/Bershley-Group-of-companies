  <body>
    <div id="root"></div>

    <!-- === FIXED NAVIGATION SCROLLING === -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Smooth scrolling for all navigation links
        const links = document.querySelectorAll('a[href]');

        links.forEach(link => {
          const href = link.getAttribute('href') || '';
          
          // Map button text / href to section IDs
          let targetId = null;
          
          if (href.includes('#') && href.length > 1) {
            targetId = href.substring(1);
          } else if (href.toLowerCase().includes('about') || href.toLowerCase().includes('bershire') || href.toLowerCase().includes('artistry')) {
            targetId = 'about';
          } else if (href.toLowerCase().includes('service') || href.toLowerCase().includes('graphic') || 
                     href.toLowerCase().includes('website') || href.toLowerCase().includes('business') || 
                     href.toLowerCase().includes('tender') || href.toLowerCase().includes('plan')) {
            targetId = 'services';
          } else if (href.toLowerCase().includes('contact')) {
            targetId = 'contact';
          } else if (href.toLowerCase().includes('quote')) {
            targetId = 'quote';
          } else if (href === '/' || href === '#' || href.toLowerCase().includes('home') || href.toLowerCase().includes('explore')) {
            targetId = 'top';
          }

          if (targetId) {
            link.addEventListener('click', function(e) {
              e.preventDefault();
              
              let target;
              if (targetId === 'top') {
                target = document.documentElement;
              } else {
                target = document.getElementById(targetId);
                if (!target) target = document.querySelector(`[id*="${targetId}"]`);
                if (!target) target = document.querySelector('section, main, div[id]');
              }

              if (target) {
                const navHeight = 90; // adjust if navbar overlaps
                const elementPosition = target.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - navHeight;

                window.scrollTo({
                  top: offsetPosition,
                  behavior: 'smooth'
                });
              }
            });
          }
        });

        // Global smooth scrolling
        document.documentElement.style.scrollBehavior = 'smooth';
      });
    </script>
  </body>
